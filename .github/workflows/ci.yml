name: Music recommender checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest -q
      - name: Verify CLI output is reproducible
        run: |
          python -m src.main > /tmp/music-demo.txt
          diff -u evaluation/demo.txt /tmp/music-demo.txt
      - name: Verify evaluation evidence is reproducible
        run: |
          python -m src.evaluate > /tmp/music-evaluation.txt
          diff -u evaluation/results.txt /tmp/music-evaluation.txt
      - name: Check Python syntax
        run: python -m compileall -q src tests
